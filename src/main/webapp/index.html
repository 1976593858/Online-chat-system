<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 / 注册</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #fff;
            width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0002;
        }
        .tab {
            display: flex;
            margin-bottom: 20px;
        }
        .tab button {
            flex: 1;
            border: none;
            background: #eee;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .tab button.active {
            background: #007bff;
            color: #fff;
        }
        .form-item {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .tip {
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="tab">
        <button id="btnLogin" class="active">登录</button>
        <button id="btnRegister">注册</button>
    </div>

    <!-- 登录表单 -->
    <div id="loginBox">
        <div class="form-item">
            <label>用户名</label>
            <input type="text" id="loginUsername" placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" id="loginPwd" placeholder="请输入密码">
        </div>
        <button class="btn" onclick="doLogin()">登录</button>
        <div class="tip" id="loginTip"></div>
    </div>

    <!-- 注册表单 -->
    <div id="registerBox" class="hidden">
        <div class="form-item">
            <label>用户名</label>
            <input type="text" id="regUsername" placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" id="regPwd" placeholder="请输入密码">
        </div>
        <div class="form-item">
            <label>昵称</label>
            <input type="text" id="regNickname" placeholder="请输入昵称">
        </div>
        <div class="form-item">
            <label>手机号</label>
            <input type="text" id="regPhone" placeholder="请输入手机号">
        </div>
        <button class="btn" onclick="doRegister()">注册</button>
        <div class="tip" id="regTip"></div>
    </div>
</div>

<script>
    // 切换登录/注册
    document.getElementById("btnLogin").onclick = function () {
        this.classList.add("active");
        document.getElementById("btnRegister").classList.remove("active");
        document.getElementById("loginBox").classList.remove("hidden");
        document.getElementById("registerBox").classList.add("hidden");
    };
    document.getElementById("btnRegister").onclick = function () {
        this.classList.add("active");
        document.getElementById("btnLogin").classList.remove("active");
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("registerBox").classList.remove("hidden");
    };

    // 登录
    function doLogin() {
        let username = document.getElementById("loginUsername").value.trim();
        let password = document.getElementById("loginPwd").value.trim();
        let tip = document.getElementById("loginTip");
        if (!username || !password) {
            tip.innerText = "用户名和密码不能为空";
            tip.style.color = "red";
            return;
        }

        fetch("/chat/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
        .then(res => res.json())
        .then(data => {
            console.log(data);
            if (data.code === 200) {
                tip.innerText = "登录成功！";
                tip.style.color = "green";
                // 登录成功后可跳转，例如：location.href = "首页地址";
            } else {
                tip.innerText = data.msg || "登录失败";
                tip.style.color = "red";
            }
        })
        .catch(e => {
            tip.innerText = "请求失败，请检查服务是否启动";
            tip.style.color = "red";
            console.error(e);
        });
    }

    // 注册
    function doRegister() {
        let username = document.getElementById("regUsername").value.trim();
        let password = document.getElementById("regPwd").value.trim();
        let nickname = document.getElementById("regNickname").value.trim();
        let phone = document.getElementById("regPhone").value.trim();
        let tip = document.getElementById("regTip");

        if (!username || !password || !nickname || !phone) {
            tip.innerText = "所有字段都不能为空";
            tip.style.color = "red";
            return;
        }

        fetch("/chat/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password,
                nickname: nickname,
                phone: phone
            })
        })
        .then(res => res.json())
        .then(data => {
            console.log(data);
            if (data.code === 200) {
                tip.innerText = "注册成功，请登录";
                tip.style.color = "green";
                // 自动切到登录
                document.getElementById("btnLogin").click();
            } else {
                tip.innerText = data.msg || "注册失败";
                tip.style.color = "red";
            }
        })
        .catch(e => {
            tip.innerText = "请求失败，请检查服务是否启动";
            tip.style.color = "red";
            console.error(e);
        });
    }
</script>

</body>
</html>
